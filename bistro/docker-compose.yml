services:
  kafka:
    image: apache/kafka:4.0.0
    container_name: bistro-kafka
    ports:
      - "9092:9092"
    environment:
      # Identidad y roles del nodo (KRaft: sin ZooKeeper)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      # Dos puertas de clientes: una para el host, otra para la red de Docker
      KAFKA_LISTENERS: HOST://0.0.0.0:9092,DOCKER://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,DOCKER:PLAINTEXT,CONTROLLER:PLAINTEXT
      # Un solo broker en dev: factor de replicación 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: bistro-kafka-ui
    ports:
      - "8090:8080"
    depends_on:
      - kafka
    environment:
      DYNAMIC_CONFIG_ENABLED: 'true'
      KAFKA_CLUSTERS_0_NAME: bistro-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  mailpit:
    image: axllent/mailpit:latest
    container_name: bistro-mailpit
    ports:
      - "1025:1025"   # SMTP (por acá le mandamos)
      - "8025:8025"   # UI web (por acá los vemos)

  postgres:
    image: postgres:17
    container_name: bistro-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: bistro
      POSTGRES_USER: bistro
      POSTGRES_PASSWORD: bistro

  keycloak-db:
    image: postgres:17
    container_name: bistro-keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U keycloak" ]
      interval: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    container_name: bistro-keycloak
    command: start-dev
    ports:
      - "8180:8080"   # 8080 lo usa bistro en nuestra máquina
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    depends_on:
      keycloak-db:
        condition: service_healthy

  lgtm:
    image: grafana/otel-lgtm:latest
    container_name: bistro-lgtm
    ports:
      - "3000:3000"   # Grafana: la pantalla para mirar trazas y métricas
      - "4318:4318"   # OTLP por HTTP: por acá las apps mandan sus datos

volumes:
  keycloak-db-data:








